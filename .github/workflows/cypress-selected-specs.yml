name: Cypress selected specs
run-name: Cypress ${{ inputs.request_id }} by ${{ inputs.requested_by }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Dashboard request ID
        required: true
        type: string
      requested_by:
        description: GitHub login that requested the run
        required: true
        type: string
      specs:
        description: JSON array of Cypress spec paths
        required: true
        type: string
      runs:
        description: Repetitions per spec
        required: true
        type: string
      threads:
        description: Concurrent repetitions
        required: true
        type: string
      browser:
        description: Cypress browser
        required: true
        type: string
      timeout_seconds:
        description: Per-run timeout in seconds
        required: true
        type: string
      cypress_config:
        description: Validated JSON object containing non-secret Cypress configuration overrides
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cypress-selected-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  repeat-selected-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPECS_JSON: ${{ inputs.specs }}
      RUNS: ${{ inputs.runs }}
      THREADS: ${{ inputs.threads }}
      BROWSER: ${{ inputs.browser }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      DASHBOARD_CYPRESS_CONFIG_JSON: ${{ inputs.cypress_config }}
      REQUEST_ID: ${{ inputs.request_id }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      STRIPES_TESTING_REF: master
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      NO_COLOR: "1"
    steps:
      - name: Check out stripes-testing
        uses: actions/checkout@v4
        with:
          repository: folio-org/stripes-testing
          ref: ${{ env.STRIPES_TESTING_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Validate request and write specs file
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const specs = JSON.parse(process.env.SPECS_JSON);
          const cypressConfig = JSON.parse(process.env.DASHBOARD_CYPRESS_CONFIG_JSON || '{}');
          const pattern = /^cypress\/e2e\/[A-Za-z0-9_./-]+\.cy\.(?:js|ts)$/;
          if (!Array.isArray(specs) || specs.length < 1 || specs.length > 25 || specs.some((spec) => !pattern.test(spec))) {
            throw new Error('Invalid selected specs payload');
          }
          for (const [name, value, minimum, maximum] of [
            ['runs', process.env.RUNS, 1, 20],
            ['threads', process.env.THREADS, 1, 4],
            ['timeout', process.env.TIMEOUT_SECONDS, 60, 1200],
          ]) {
            const number = Number(value);
            if (!Number.isInteger(number) || number < minimum || number > maximum) throw new Error(`Invalid ${name}`);
          }
          if (!['chrome', 'electron'].includes(process.env.BROWSER)) throw new Error('Invalid browser');
          if (!cypressConfig || Array.isArray(cypressConfig) || typeof cypressConfig !== 'object') {
            throw new Error('Invalid Cypress configuration');
          }
          const entries = Object.entries(cypressConfig);
          const blocked = new Set(['baseurl', 'env', 'specpattern', 'supportfile', 'fixturesfolder', 'downloadsfolder', 'screenshotsfolder', 'videosfolder', 'fileserverfolder', 'setupnodeevents', 'projectid']);
          if (entries.length > 30) throw new Error('Too many Cypress configuration values');
          for (const [key, value] of entries) {
            if (!/^[a-z][A-Za-z0-9]{0,99}$/.test(key) || blocked.has(key.toLowerCase())) throw new Error(`Unsupported Cypress configuration: ${key}`);
            if (!['string', 'number', 'boolean'].includes(typeof value) || (typeof value === 'number' && !Number.isFinite(value)) || (typeof value === 'string' && (value.length > 500 || /[\r\n]/.test(value)))) {
              throw new Error(`Invalid Cypress configuration: ${key}`);
            }
            const environmentVariable = `CYPRESS_${key.replace(/([a-z0-9])([A-Z])/g, '$1_$2').toUpperCase()}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `${environmentVariable}=${value}\n`);
          }
          fs.writeFileSync('selected-specs.txt', `${[...new Set(specs)].join('\n')}\n`);
          fs.writeFileSync('run-config.json', `${JSON.stringify({
            cypressConfig,
          }, null, 2)}\n`);
          NODE

      - name: Configure Cypress environment
        run: |
          if [[ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" || -z "$ACTIONS_ID_TOKEN_REQUEST_URL" || -z "$DASHBOARD_BASE_URL" ]]; then
            echo "Missing dashboard profile delivery configuration" >&2
            exit 1
          fi
          OIDC_TOKEN="$(node <<'NODE'
          (async () => {
            const audience = 'rp-failure-intelligence:cypress-profile';
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', audience);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            if (!response.ok) throw new Error(`Unable to obtain GitHub OIDC token: ${response.status}`);
            const body = await response.json();
            if (typeof body.value !== 'string') throw new Error('GitHub OIDC token response is invalid');
            process.stdout.write(body.value);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : 'Unable to obtain GitHub OIDC token');
            process.exitCode = 1;
          });
          NODE
          )"
          echo "::add-mask::$OIDC_TOKEN"
          PROFILE_STATUS="$(curl --silent --show-error \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            "$DASHBOARD_BASE_URL/api/workflow/cypress-profile?requestId=$REQUEST_ID" \
            --output run-profile.json \
            --write-out '%{http_code}')"
          if [[ "$PROFILE_STATUS" != "200" ]]; then
            echo "Unable to retrieve Cypress profile: dashboard returned $PROFILE_STATUS" >&2
            exit 1
          fi
          chmod 600 run-profile.json
          node <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('run-profile.json', 'utf8'));
          if (!snapshot || !/^[A-Za-z0-9_. -]{1,80}$/.test(snapshot.name) || !snapshot.environment) {
            throw new Error('Invalid Cypress profile response');
          }
          const escapeWorkflowCommand = (value) => String(value).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          if (!snapshot.environment.env || Array.isArray(snapshot.environment.env) || typeof snapshot.environment.env !== 'object') throw new Error('Invalid Cypress profile environment');
          const secretKeys = snapshot.environment.secretKeys || ['diku_password', 'EDGE_API_KEY'];
          if (!Array.isArray(secretKeys) || secretKeys.some((key) => typeof key !== 'string' || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(key))) throw new Error('Invalid Cypress secret keys');
          for (const key of secretKeys) {
            const secret = snapshot.environment.env?.[key];
            if (typeof secret === 'string' && secret) process.stdout.write(`::add-mask::${escapeWorkflowCommand(secret)}\n`);
          }
          const environmentKey = snapshot.name.replaceAll(' ', '-');
          fs.writeFileSync('environments.js', `module.exports = ${JSON.stringify({
            activeEnvironment: environmentKey,
            environments: { [environmentKey]: snapshot.environment },
          }, null, 2)};\n`, { mode: 0o600 });
          const runConfig = JSON.parse(fs.readFileSync('run-config.json', 'utf8'));
          fs.writeFileSync('run-config.json', `${JSON.stringify({ ...runConfig, profile: snapshot.name }, null, 2)}\n`);
          fs.rmSync('run-profile.json');
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run selected specs
        run: |
          yarn cypress:repeat \
            --specs-file selected-specs.txt \
            --runs "$RUNS" \
            --threads "$THREADS" \
            --browser "$BROWSER" \
            --timeout-sec "$TIMEOUT_SECONDS"

      - name: Remove Cypress credentials
        if: always()
        run: rm -f run-profile.json environments.js

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-selected-${{ inputs.request_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .local/cypress-run-logs/
            allure-results/
            cypress/screenshots/
            cypress/videos/
            selected-specs.txt
            run-config.json

      - name: Run metadata
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runConfig = JSON.parse(fs.readFileSync('run-config.json', 'utf8'));
          const specCount = fs.existsSync('selected-specs.txt')
            ? fs.readFileSync('selected-specs.txt', 'utf8').split('\n').filter(Boolean).length
            : 0;
          const lines = [
            '### Cypress selected specs',
            `- Requested by: ${process.env.REQUESTED_BY}`,
            `- Request ID: ${process.env.REQUEST_ID}`,
            `- Specs: ${specCount}`,
            `- Runs per spec: ${process.env.RUNS}`,
            `- Threads: ${process.env.THREADS}`,
            `- Browser: ${process.env.BROWSER}`,
            `- Cypress profile: ${runConfig.profile || 'unavailable'}`,
            `- Cypress overrides: ${Object.keys(runConfig.cypressConfig || {}).join(', ') || 'none'}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
