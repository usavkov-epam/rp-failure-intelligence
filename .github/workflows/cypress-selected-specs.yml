name: Cypress selected specs
run-name: Cypress ${{ inputs.request_id }} by ${{ inputs.requested_by }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Dashboard request ID
        required: true
        type: string
      requested_by:
        description: GitHub login that requested the run
        required: true
        type: string
      specs:
        description: JSON array of Cypress spec paths
        required: true
        type: string
      runs:
        description: Repetitions per spec
        required: true
        type: string
      threads:
        description: Concurrent repetitions
        required: true
        type: string
      browser:
        description: Cypress browser
        required: true
        type: string
      timeout_seconds:
        description: Per-run timeout in seconds
        required: true
        type: string
      cypress_config:
        description: Validated JSON object containing non-secret Cypress configuration overrides
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: cypress-selected-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  repeat-selected-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPECS_JSON: ${{ inputs.specs }}
      RUNS: ${{ inputs.runs }}
      THREADS: ${{ inputs.threads }}
      BROWSER: ${{ inputs.browser }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      DASHBOARD_CYPRESS_CONFIG_JSON: ${{ inputs.cypress_config }}
      REQUEST_ID: ${{ inputs.request_id }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      STRIPES_TESTING_REF: master
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      NO_COLOR: "1"
    steps:
      - name: Check out stripes-testing
        uses: actions/checkout@v4
        with:
          repository: folio-org/stripes-testing
          ref: ${{ env.STRIPES_TESTING_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Validate request and write specs file
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const specs = JSON.parse(process.env.SPECS_JSON);
          const cypressConfig = JSON.parse(process.env.DASHBOARD_CYPRESS_CONFIG_JSON || '{}');
          const pattern = /^cypress\/e2e\/[A-Za-z0-9_./-]+\.cy\.(?:js|ts)$/;
          if (!Array.isArray(specs) || specs.length < 1 || specs.length > 25 || specs.some((spec) => !pattern.test(spec))) {
            throw new Error('Invalid selected specs payload');
          }
          for (const [name, value, minimum, maximum] of [
            ['runs', process.env.RUNS, 1, 20],
            ['threads', process.env.THREADS, 1, 4],
            ['timeout', process.env.TIMEOUT_SECONDS, 60, 1200],
          ]) {
            const number = Number(value);
            if (!Number.isInteger(number) || number < minimum || number > maximum) throw new Error(`Invalid ${name}`);
          }
          if (!['chrome', 'electron'].includes(process.env.BROWSER)) throw new Error('Invalid browser');
          const rules = {
            viewportWidth: ['CYPRESS_VIEWPORT_WIDTH', 320, 3840, 'number'],
            viewportHeight: ['CYPRESS_VIEWPORT_HEIGHT', 320, 2160, 'number'],
            defaultCommandTimeout: ['CYPRESS_DEFAULT_COMMAND_TIMEOUT', 1000, 300000, 'number'],
            pageLoadTimeout: ['CYPRESS_PAGE_LOAD_TIMEOUT', 1000, 300000, 'number'],
            requestTimeout: ['CYPRESS_REQUEST_TIMEOUT', 1000, 300000, 'number'],
            responseTimeout: ['CYPRESS_RESPONSE_TIMEOUT', 1000, 300000, 'number'],
            retries: ['CYPRESS_RETRIES', 0, 5, 'number'],
            video: ['CYPRESS_VIDEO', null, null, 'boolean'],
            screenshotOnRunFailure: ['CYPRESS_SCREENSHOT_ON_RUN_FAILURE', null, null, 'boolean'],
          };
          if (!cypressConfig || Array.isArray(cypressConfig) || typeof cypressConfig !== 'object') {
            throw new Error('Invalid Cypress configuration');
          }
          for (const [key, value] of Object.entries(cypressConfig)) {
            const rule = rules[key];
            if (!rule) throw new Error(`Unsupported Cypress configuration: ${key}`);
            const [environmentVariable, minimum, maximum, type] = rule;
            const validNumber = type === 'number' && Number.isInteger(value) && value >= minimum && value <= maximum;
            const validBoolean = type === 'boolean' && typeof value === 'boolean';
            if (!validNumber && !validBoolean) throw new Error(`Invalid Cypress configuration: ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${environmentVariable}=${value}\n`);
          }
          fs.writeFileSync('selected-specs.txt', `${[...new Set(specs)].join('\n')}\n`);
          fs.writeFileSync('run-config.json', `${JSON.stringify({
            cypressConfig,
          }, null, 2)}\n`);
          NODE

      - name: Configure Cypress environment
        env:
          PROFILE_ACCESS_TOKEN: ${{ secrets.DASHBOARD_PROFILE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$PROFILE_ACCESS_TOKEN" || -z "$DASHBOARD_BASE_URL" ]]; then
            echo "Missing dashboard profile delivery configuration" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $PROFILE_ACCESS_TOKEN" \
            "$DASHBOARD_BASE_URL/api/workflow/cypress-profile?requestId=$REQUEST_ID" \
            --output run-profile.json
          chmod 600 run-profile.json
          node <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('run-profile.json', 'utf8'));
          if (!snapshot || !/^[A-Za-z0-9_. -]{1,80}$/.test(snapshot.name) || !snapshot.environment) {
            throw new Error('Invalid Cypress profile response');
          }
          const environmentKey = snapshot.name.replaceAll(' ', '-');
          fs.writeFileSync('environments.js', `module.exports = ${JSON.stringify({
            activeEnvironment: environmentKey,
            environments: { [environmentKey]: snapshot.environment },
          }, null, 2)};\n`, { mode: 0o600 });
          const runConfig = JSON.parse(fs.readFileSync('run-config.json', 'utf8'));
          fs.writeFileSync('run-config.json', `${JSON.stringify({ ...runConfig, profile: snapshot.name }, null, 2)}\n`);
          fs.rmSync('run-profile.json');
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run selected specs
        run: |
          yarn cypress:repeat \
            --specs-file selected-specs.txt \
            --runs "$RUNS" \
            --threads "$THREADS" \
            --browser "$BROWSER" \
            --timeout-sec "$TIMEOUT_SECONDS"

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-selected-${{ inputs.request_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .local/cypress-run-logs/
            allure-results/
            cypress/screenshots/
            cypress/videos/
            selected-specs.txt
            run-config.json

      - name: Run metadata
        if: always()
        run: |
          {
            echo "### Cypress selected specs"
            echo "- Requested by: $REQUESTED_BY"
            echo "- Request ID: $REQUEST_ID"
            echo "- Specs: $(wc -l < selected-specs.txt 2>/dev/null || echo 0)"
            echo "- Runs per spec: $RUNS"
            echo "- Threads: $THREADS"
            echo "- Browser: $BROWSER"
            echo "- Cypress profile: $(node -e 'console.log(require("./run-config.json").profile)')"
            echo "- Cypress overrides: $(node -e \"const c=require('./run-config.json').cypressConfig; console.log(Object.keys(c).join(', ') || 'none')\")"
          } >> "$GITHUB_STEP_SUMMARY"
